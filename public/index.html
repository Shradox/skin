<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DmitrashDrop</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <b>◈ DMITRASH<span>DROP</span></b>
        <nav>
            <a href="#cases"><i>📦</i>Кейсы</a>
            <a href="#upgrade"><i>⚡</i>Апгрейд</a>
            <a href="#contracts"><i>📜</i>Контракты</a>
            <a href="#inventory"><i>🎒</i>Инвентарь</a>
            <a href="#admin" id="adminlink" hidden><i>⚙</i>Админ</a>
        </nav>
        <div>
            <strong id="bal">$0.00</strong>
            <button id="login">Войти</button>
        </div>
    </header>

    <main>
        <section id="cases" class="page">
            <div class="hero">
                <div>
                    <small>DMITRASHDROP · CS2 CASES · DEMO</small>
                    <h1>Открывай.<br><i>Лови редкое.</i></h1>
                    <p>Реальные цены маркета, все износы, StatTrak™ и Souvenir.</p>
                </div>
                <div class="orb">
                    <img src="case-image.png" alt="DmitrashDrop Кейс">
                </div>
            </div>
            <div class="head">
                <h2>Кейсы</h2>
                <input id="q" placeholder="Поиск...">
            </div>
            <div id="casesGrid" class="grid"></div>
        </section>

        <section id="upgrade" class="page">
            <h2>Апгрейд</h2>
            <div id="up"></div>
        </section>

        <section id="contracts" class="page">
            <h2>Контракты</h2>
            <div id="ct"></div>
        </section>

        <section id="inventory" class="page">
            <div class="head">
                <h2>Инвентарь <small id="invsum"></small></h2>
                <button class="red" onclick="sellAll()">Продать всё</button>
            </div>
            <div id="invgrid" class="grid"></div>
        </section>

        <section id="admin" class="page">
            <div class="head">
                <h2>Админ · TEST MODE</h2>
                <button class="red" onclick="resetOdds()">Сбросить шансы</button>
            </div>
            <p class="warn">Только тестовая настройка. Изменения журналируются.</p>
            <div id="adminbox"></div>
        </section>
    </main>

    <div id="modal" hidden>
        <div class="modal">
            <button class="x" onclick="closeM()">×</button>
            <div id="m"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
